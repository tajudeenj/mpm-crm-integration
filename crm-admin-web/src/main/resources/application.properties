# ============================================================
# CRM Admin Web - Application Configuration
# Update DB connection details before running
# ============================================================

# Server
server.port=8080

# Oracle DB Connection -- update these values
spring.datasource.url=jdbc:oracle:thin:@//your-db-host:1521/your-service-name
spring.datasource.username=APPS
spring.datasource.password=your-db-password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# App
spring.application.name=crm-admin-web
logging.level.com.adib.crm=INFO

# Login credentials -- change these before deploying
spring.security.user.name=crmadmin
spring.security.user.password=Adib@CRM2024
spring.security.user.roles=ADMIN
