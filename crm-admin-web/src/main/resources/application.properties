# ============================================================
# CRM Admin Web - Application Configuration
# Update DB connection details before running
# Place this file next to the JAR to override without recompile
# ============================================================

# Server
server.port=8080

# Oracle DB Connection -- update these 3 values
spring.datasource.url=jdbc:oracle:thin:@//your-db-host:1521/your-service-name
spring.datasource.username=APPS
spring.datasource.password=your-db-password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Fix duplicate bean error if it occurs
spring.main.allow-bean-definition-overriding=true

# Session timeout (30 minutes)
server.servlet.session.timeout=30m

# App
spring.application.name=crm-admin-web
logging.level.com.adib.crm=INFO
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=WARN

# Log to file (optional - uncomment to enable)
# logging.file.name=crm-admin.log
# logging.file.max-size=10MB
# logging.file.max-history=5

# Login managed in SecurityConfig.java (users stored in CRM_MPM_APP_USERS table)
