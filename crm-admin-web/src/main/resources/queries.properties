# =============================================================================
# CRM Admin Web -- SQL Query Store
# ADIB MPM Properties CRM Integration
# -----------------------------------------------------------------------------
# Same convention as admin-tool/crm-admin.properties (standalone Swing tool).
# Loaded by com.adib.crm.admin.config.QueryStore.
#
# OVERRIDE WITHOUT RECOMPILE:
#   Copy this file next to the JAR as ./queries.properties (only the keys you
#   want to change are needed) and restart. Or: -Dcrm.queries.file=/path/x.properties
#
# RULES
#   - Keep a SPACE before every trailing backslash (\) -- continuation lines
#     are joined with leading whitespace stripped.
#   - Bind with ? (positional). Order of ? must match the Java call.
#   - Avoid backslashes inside SQL (regex): use [^ ] style classes instead.
#   - *.filter.* keys are AND-clauses appended by Java only when a filter is set
#     (avoids ORA-17004 NULL TIMESTAMP binds).
# =============================================================================


# =============================================================================
# TAB: CREDENTIALS
# =============================================================================
query.cred.list=\
SELECT CRED_CODE, CLIENT_ID, TOKEN_URL, IS_ACTIVE, \
       CASE WHEN CLIENT_SECRET_ENCRYPTED IS NOT NULL THEN 'AES256 OK' ELSE 'Plain Text' END AS SECRET_ENC, \
       TO_CHAR(UPDATED_DATE,'DD-MON-YY HH24:MI') AS UPDATED \
FROM   CRM_MPM_API_CREDENTIALS \
ORDER  BY CRED_CODE

query.cred.load.single=\
SELECT CRED_CODE, TOKEN_URL, CLIENT_ID, \
       NVL(SCOPE,''), NVL(GRANT_TYPE,'client_credentials'), \
       NVL(WALLET_PATH,''), IS_ACTIVE \
FROM   CRM_MPM_API_CREDENTIALS \
WHERE  CRED_CODE = ?

# Binds: secret, credCode, tokenUrl, clientId, scope, grantType, walletPath, walletPwd, isActive,
#        credCode, tokenUrl, clientId, scope, grantType, walletPath, walletPwd, isActive
query.cred.save=\
DECLARE \
    v_key RAW(32); v_sec_enc BLOB; \
BEGIN \
    SELECT ENCRYPT_KEY INTO v_key FROM CRM_MPM_ENCRYPT_CONFIG \
    WHERE  IS_ACTIVE='Y' AND ROWNUM=1; \
    v_sec_enc := DBMS_CRYPTO.ENCRYPT( \
        src => UTL_RAW.CAST_TO_RAW(?), \
        typ => DBMS_CRYPTO.ENCRYPT_AES256+DBMS_CRYPTO.CHAIN_CBC+DBMS_CRYPTO.PAD_PKCS5, \
        key => v_key); \
    MERGE INTO CRM_MPM_API_CREDENTIALS t \
    USING (SELECT ? AS cc FROM DUAL) s ON (t.CRED_CODE=s.cc) \
    WHEN MATCHED THEN UPDATE SET \
        TOKEN_URL=?, CLIENT_ID=?, CLIENT_SECRET_ENCRYPTED=v_sec_enc, \
        CLIENT_SECRET_REF='*** ENCRYPTED ***', ENCRYPT_KEY_REF='CRM_INTEGRATION_KEY', \
        SCOPE=?, GRANT_TYPE=?, WALLET_PATH=?, WALLET_PASSWORD=?, \
        IS_ACTIVE=?, UPDATED_DATE=SYSDATE \
    WHEN NOT MATCHED THEN INSERT ( \
        CRED_CODE, TOKEN_URL, CLIENT_ID, CLIENT_SECRET_ENCRYPTED, \
        CLIENT_SECRET_REF, ENCRYPT_KEY_REF, SCOPE, GRANT_TYPE, \
        WALLET_PATH, WALLET_PASSWORD, IS_ACTIVE, CREATED_DATE, UPDATED_DATE) \
    VALUES (?, ?, ?, v_sec_enc, '*** ENCRYPTED ***', 'CRM_INTEGRATION_KEY', \
        ?, ?, ?, ?, ?, SYSDATE, SYSDATE); \
END;

query.cred.rotate.secret=\
DECLARE v_key RAW(32); v_enc BLOB; \
BEGIN \
    SELECT ENCRYPT_KEY INTO v_key FROM CRM_MPM_ENCRYPT_CONFIG \
    WHERE  IS_ACTIVE='Y' AND ROWNUM=1; \
    v_enc := DBMS_CRYPTO.ENCRYPT(src=>UTL_RAW.CAST_TO_RAW(?), \
             typ=>DBMS_CRYPTO.ENCRYPT_AES256+DBMS_CRYPTO.CHAIN_CBC+DBMS_CRYPTO.PAD_PKCS5, key=>v_key); \
    UPDATE CRM_MPM_API_CREDENTIALS SET CLIENT_SECRET_ENCRYPTED=v_enc, \
           CLIENT_SECRET_REF='*** ENCRYPTED ***', ENCRYPT_KEY_REF='CRM_INTEGRATION_KEY', \
           UPDATED_DATE=SYSDATE \
    WHERE  CRED_CODE=?; \
END;

query.cred.rotate.wallet=\
UPDATE CRM_MPM_API_CREDENTIALS SET WALLET_PASSWORD=?, UPDATED_DATE=SYSDATE WHERE CRED_CODE=?

# Callable: 1=credCode IN, 2=result OUT
query.cred.test.wallet=\
DECLARE v_plain VARCHAR2(4000); v_result VARCHAR2(4000); \
BEGIN \
    SELECT NVL(WALLET_PASSWORD,'NULL') INTO v_plain FROM CRM_MPM_API_CREDENTIALS WHERE CRED_CODE=?; \
    IF v_plain IS NULL OR v_plain='NULL' THEN v_result:='NOT SET'; \
    ELSIF v_plain='*** ENCRYPTED ***' THEN v_result:='Stored as encrypted marker'; \
    ELSE v_result:='Plain text - length='||LENGTH(v_plain); END IF; \
    ?:=v_result; \
END;

# Callable: 1=credCode IN, 2=result OUT
query.cred.test.secret=\
DECLARE v_key RAW(32); v_enc BLOB; v_dec VARCHAR2(4000); v_result VARCHAR2(4000); \
BEGIN \
    SELECT ENCRYPT_KEY INTO v_key FROM CRM_MPM_ENCRYPT_CONFIG WHERE IS_ACTIVE='Y' AND ROWNUM=1; \
    SELECT CLIENT_SECRET_ENCRYPTED INTO v_enc FROM CRM_MPM_API_CREDENTIALS WHERE CRED_CODE=?; \
    IF v_enc IS NOT NULL THEN \
        v_dec:=UTL_RAW.CAST_TO_VARCHAR2(DBMS_CRYPTO.DECRYPT(src=>v_enc, \
               typ=>DBMS_CRYPTO.ENCRYPT_AES256+DBMS_CRYPTO.CHAIN_CBC+DBMS_CRYPTO.PAD_PKCS5,key=>v_key)); \
        v_result:='OK - length='||LENGTH(v_dec); \
    ELSE v_result:='NOT ENCRYPTED'; END IF; \
    ?:=v_result; \
END;

query.cred.codes=\
SELECT CRED_CODE FROM CRM_MPM_API_CREDENTIALS WHERE IS_ACTIVE='Y' ORDER BY CRED_CODE


# =============================================================================
# TAB: SERVICE REGISTRY
# NOTE: column ORDER is used positionally by index.html (v[0]..v[25]) --
#       add new columns only at the END.
# =============================================================================
query.registry.list=\
SELECT SERVICE_NAME, ENTITY_NAME, OPERATION_TYPE, SOURCE_TYPE, \
       NVL(SOURCE_VIEW,''), NVL(SOURCE_PROC,''), NVL(SOURCE_FILTER_COL,''), NVL(SOURCE_KEY_COL,''), \
       NVL(SOURCE_EXTRA_FILTER,''), \
       NVL(JSON_MAPPING_NAME,''), NVL(RECORD_TYPE_HDR,''), NVL(EVENT_CODE_HDR,''), \
       NVL(APIC_ENDPOINT_URL,''), NVL(HTTP_METHOD,''), NVL(APIC_API_VERSION,''), \
       NVL(CALLBACK_TARGET_TABLE,''), NVL(CALLBACK_KEY_COL,''), \
       NVL(CALLBACK_STATUS_COL,''), NVL(CALLBACK_REF_COL,''), NVL(POST_CALLBACK_PROC,''), \
       NVL(CRED_CODE,''), TO_CHAR(NVL(EXECUTION_ORDER,99)), TO_CHAR(NVL(BATCH_SIZE,100)), \
       TO_CHAR(NVL(MAX_RETRY_COUNT,3)), TO_CHAR(NVL(RETRY_INTERVAL_MINUTES,30)), \
       TO_CHAR(NVL(TIMEOUT_MINUTES,60)), IS_ACTIVE \
FROM   CRM_MPM_API_REGISTRY \
ORDER  BY EXECUTION_ORDER, SERVICE_NAME

# Binds: 27 for MERGE match/update + 27 for insert (see CrmAdminService.saveRegistry)
query.registry.save=\
MERGE INTO CRM_MPM_API_REGISTRY r USING (SELECT ? AS sn FROM DUAL) s ON (r.SERVICE_NAME=s.sn) \
WHEN MATCHED THEN UPDATE SET ENTITY_NAME=?, OPERATION_TYPE=?, SOURCE_TYPE=?, \
    SOURCE_VIEW=?, SOURCE_PROC=?, SOURCE_FILTER_COL=?, SOURCE_KEY_COL=?, \
    SOURCE_EXTRA_FILTER=?, \
    JSON_MAPPING_NAME=?, RECORD_TYPE_HDR=?, EVENT_CODE_HDR=?, \
    APIC_ENDPOINT_URL=?, HTTP_METHOD=?, APIC_API_VERSION=?, \
    CALLBACK_TARGET_TABLE=?, CALLBACK_KEY_COL=?, CALLBACK_STATUS_COL=?, CALLBACK_REF_COL=?, \
    POST_CALLBACK_PROC=?, CRED_CODE=?, \
    EXECUTION_ORDER=TO_NUMBER(?), BATCH_SIZE=TO_NUMBER(?), MAX_RETRY_COUNT=TO_NUMBER(?), \
    RETRY_INTERVAL_MINUTES=TO_NUMBER(?), TIMEOUT_MINUTES=TO_NUMBER(?), IS_ACTIVE=?, UPDATED_DATE=SYSDATE \
WHEN NOT MATCHED THEN INSERT ( \
    SERVICE_NAME, ENTITY_NAME, OPERATION_TYPE, SOURCE_TYPE, SOURCE_VIEW, SOURCE_PROC, \
    SOURCE_FILTER_COL, SOURCE_KEY_COL, SOURCE_EXTRA_FILTER, \
    JSON_MAPPING_NAME, RECORD_TYPE_HDR, EVENT_CODE_HDR, \
    APIC_ENDPOINT_URL, HTTP_METHOD, APIC_API_VERSION, CALLBACK_TARGET_TABLE, CALLBACK_KEY_COL, \
    CALLBACK_STATUS_COL, CALLBACK_REF_COL, POST_CALLBACK_PROC, CRED_CODE, \
    EXECUTION_ORDER, BATCH_SIZE, MAX_RETRY_COUNT, RETRY_INTERVAL_MINUTES, TIMEOUT_MINUTES, IS_ACTIVE, \
    CREATED_DATE, UPDATED_DATE) \
VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?, \
    TO_NUMBER(?),TO_NUMBER(?),TO_NUMBER(?),TO_NUMBER(?),TO_NUMBER(?),?,SYSDATE,SYSDATE)

query.registry.toggle=\
UPDATE CRM_MPM_API_REGISTRY SET IS_ACTIVE=?, UPDATED_DATE=SYSDATE WHERE SERVICE_NAME=?


# =============================================================================
# TAB: FIELD MAPPINGS
# =============================================================================
query.mapping.names=\
SELECT DISTINCT JSON_MAPPING_NAME FROM CRM_MPM_API_FIELD_MAPPING ORDER BY JSON_MAPPING_NAME

query.mapping.list.all=\
SELECT TO_CHAR(MAPPING_ID), JSON_MAPPING_NAME, TO_CHAR(DISPLAY_ORDER), \
       SOURCE_COLUMN, JSON_PATH, DATA_TYPE, NVL(DATE_FORMAT,''), NVL(IS_MANDATORY,'N'), IS_ACTIVE \
FROM   CRM_MPM_API_FIELD_MAPPING \
ORDER  BY JSON_MAPPING_NAME, DISPLAY_ORDER

query.mapping.list.byname=\
SELECT TO_CHAR(MAPPING_ID), JSON_MAPPING_NAME, TO_CHAR(DISPLAY_ORDER), \
       SOURCE_COLUMN, JSON_PATH, DATA_TYPE, NVL(DATE_FORMAT,''), NVL(IS_MANDATORY,'N'), IS_ACTIVE \
FROM   CRM_MPM_API_FIELD_MAPPING \
WHERE  JSON_MAPPING_NAME=? \
ORDER  BY DISPLAY_ORDER

query.mapping.save=\
MERGE INTO CRM_MPM_API_FIELD_MAPPING m USING (SELECT ? AS jmn, ? AS sc FROM DUAL) s \
ON (m.JSON_MAPPING_NAME=s.jmn AND m.SOURCE_COLUMN=s.sc) \
WHEN MATCHED THEN UPDATE SET DISPLAY_ORDER=TO_NUMBER(?), JSON_PATH=?, DATA_TYPE=?, \
    DATE_FORMAT=?, IS_MANDATORY=?, IS_ACTIVE=? \
WHEN NOT MATCHED THEN INSERT (JSON_MAPPING_NAME, DISPLAY_ORDER, SOURCE_COLUMN, \
    JSON_PATH, DATA_TYPE, DATE_FORMAT, IS_MANDATORY, IS_ACTIVE) \
VALUES (?, TO_NUMBER(?), ?, ?, ?, ?, ?, ?)

query.mapping.toggle=\
UPDATE CRM_MPM_API_FIELD_MAPPING SET IS_ACTIVE=? WHERE MAPPING_ID=TO_NUMBER(?)


# =============================================================================
# TAB: WATERMARK
# =============================================================================
query.watermark.list=\
SELECT R.SERVICE_NAME, TO_CHAR(W.LAST_PROCESSED_TS,'DD-MON-YY HH24:MI'), \
       NVL(W.LAST_RUN_STATUS,'--'), TO_CHAR(NVL(W.LAST_RUN_RECORDS,0)), TO_CHAR(R.REGISTRY_ID) \
FROM   CRM_MPM_API_REGISTRY R \
LEFT   JOIN CRM_MPM_API_WATERMARK W ON W.REGISTRY_ID=R.REGISTRY_ID \
WHERE  R.IS_ACTIVE='Y' \
ORDER  BY R.EXECUTION_ORDER, R.SERVICE_NAME

query.watermark.reset=\
UPDATE CRM_MPM_API_WATERMARK SET LAST_PROCESSED_TS=NULL, LAST_RUN_RECORDS=0, \
       LAST_RUN_STATUS='RESET', UPDATED_DATE=SYSDATE \
WHERE  REGISTRY_ID=(SELECT REGISTRY_ID FROM CRM_MPM_API_REGISTRY WHERE SERVICE_NAME=?)

query.watermark.setdate=\
UPDATE CRM_MPM_API_WATERMARK SET LAST_PROCESSED_TS=TO_TIMESTAMP(?,'DD-MON-YY HH24:MI'), \
       UPDATED_DATE=SYSDATE \
WHERE  REGISTRY_ID=(SELECT REGISTRY_ID FROM CRM_MPM_API_REGISTRY WHERE SERVICE_NAME=?)


# =============================================================================
# TAB: ERROR CODES
# =============================================================================
query.errorcode.list=\
SELECT ERROR_CODE, ERROR_CATEGORY, ERROR_DESCRIPTION, IS_RETRYABLE \
FROM   CRM_MPM_ERROR_CODE_MASTER \
ORDER  BY IS_RETRYABLE DESC, ERROR_CODE

query.errorcode.save=\
MERGE INTO CRM_MPM_ERROR_CODE_MASTER e USING (SELECT ? AS ec FROM DUAL) s ON (e.ERROR_CODE=s.ec) \
WHEN MATCHED THEN UPDATE SET ERROR_CATEGORY=?, ERROR_DESCRIPTION=?, IS_RETRYABLE=? \
WHEN NOT MATCHED THEN INSERT (ERROR_CODE, ERROR_CATEGORY, ERROR_DESCRIPTION, IS_RETRYABLE) \
VALUES (?, ?, ?, ?)


# =============================================================================
# TAB: MONITOR
# RELEASED rows are bookkeeping (a PARENT_PENDING row that has been sent) --
# excluded from counts so a record is never counted twice.
# =============================================================================
query.monitor.dashboard=\
SELECT R.SERVICE_NAME, COUNT(*) AS TOTAL, \
       SUM(CASE WHEN L.FINAL_STATUS='SUCCESS' THEN 1 ELSE 0 END) AS SUCCESS, \
       SUM(CASE WHEN L.FINAL_STATUS IN ('SENT','PENDING') THEN 1 ELSE 0 END) AS PENDING, \
       SUM(CASE WHEN L.FINAL_STATUS='VALIDATION_FAILED' THEN 1 ELSE 0 END) AS VAL_FAILED, \
       SUM(CASE WHEN L.FINAL_STATUS='DUPLICATE_RECORD' THEN 1 ELSE 0 END) AS DUPLICATE, \
       SUM(CASE WHEN L.FINAL_STATUS IN ('FAILED','TIMEOUT','RETRY_IN_PROGRESS') THEN 1 ELSE 0 END) AS AUTO_RETRY, \
       SUM(CASE WHEN L.FINAL_STATUS='EXHAUSTED' THEN 1 ELSE 0 END) AS EXHAUSTED, \
       SUM(CASE WHEN L.FINAL_STATUS='RECORD_NOT_FOUND' THEN 1 ELSE 0 END) AS PARENT_MISSING, \
       SUM(CASE WHEN L.FINAL_STATUS IN ('VALIDATION_FAILED','EXHAUSTED','RECORD_NOT_FOUND','CRM_REJECTED','PARENT_FAILED') \
                 AND NVL(L.MANUAL_RETRY,'N')='N' THEN 1 ELSE 0 END) AS ACTION_NEEDED, \
       TO_CHAR(MAX(L.SENT_DATE),'DD-MON-YY HH24:MI') AS LAST_SENT, \
       SUM(CASE WHEN L.FINAL_STATUS='PARENT_PENDING' THEN 1 ELSE 0 END) AS PARENT_PENDING, \
       SUM(CASE WHEN L.FINAL_STATUS='PARENT_FAILED' THEN 1 ELSE 0 END) AS PARENT_FAILED \
FROM   CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN   CRM_MPM_API_REGISTRY R ON R.REGISTRY_ID=L.REGISTRY_ID \
WHERE  L.FINAL_STATUS <> 'RELEASED' \
GROUP  BY R.SERVICE_NAME \
ORDER  BY ACTION_NEEDED DESC, R.SERVICE_NAME

# --- All Records (base + optional filters + order) ---
query.monitor.records.base=\
SELECT L.LOG_ID, R.SERVICE_NAME, L.SOURCE_RECORD_ID, L.FINAL_STATUS, \
       DBMS_LOB.SUBSTR(L.REQUEST_PAYLOAD,2000,1) AS DATA_SENT, \
       SUBSTR(L.CALLBACK_VALID_ERRORS,1,300) AS FAILED_FIELDS, \
       SUBSTR(L.CALLBACK_RESULT_DESC,1,200) AS CRM_RESPONSE, \
       SUBSTR(L.ERROR_MESSAGE,1,200) AS ERROR_DETAIL, \
       L.CRM_REFERENCE_NO, TO_CHAR(L.SENT_DATE,'DD-MON-YY HH24:MI') AS SENT_DATE, \
       TO_CHAR(L.CALLBACK_DATE,'DD-MON-YY HH24:MI') AS CALLBACK_DATE, \
       L.RETRY_COUNT||'/'||R.MAX_RETRY_COUNT AS RETRY, NVL(L.MANUAL_RETRY,'N') AS MANUAL_RETRY \
FROM   CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN   CRM_MPM_API_REGISTRY R ON R.REGISTRY_ID=L.REGISTRY_ID \
WHERE  1=1
query.monitor.records.filter.service= AND R.SERVICE_NAME=?
query.monitor.records.filter.status= AND L.FINAL_STATUS=?
query.monitor.records.filter.from= AND NVL(L.SENT_DATE,L.CREATED_DATE)>=TO_DATE(?,'DD-MON-YY')
query.monitor.records.filter.to= AND NVL(L.SENT_DATE,L.CREATED_DATE)<TO_DATE(?,'DD-MON-YY')+1
query.monitor.records.filter.recid= AND L.SOURCE_RECORD_ID LIKE '%'||?||'%'
query.monitor.records.order= ORDER BY L.LOG_ID DESC FETCH FIRST 500 ROWS ONLY

query.monitor.action=\
SELECT L.LOG_ID, R.SERVICE_NAME, L.SOURCE_RECORD_ID, L.FINAL_STATUS, \
       DBMS_LOB.SUBSTR(L.REQUEST_PAYLOAD,2000,1) AS DATA_SENT, \
       SUBSTR(L.CALLBACK_VALID_ERRORS,1,300) AS FAILED_FIELDS, \
       SUBSTR(L.CALLBACK_RESULT_DESC,1,200) AS CRM_RESPONSE, \
       SUBSTR(L.ERROR_MESSAGE,1,200) AS ERROR_DETAIL, \
       TO_CHAR(L.SENT_DATE,'DD-MON-YY HH24:MI') AS SENT_DATE, \
       TO_CHAR(L.CALLBACK_DATE,'DD-MON-YY HH24:MI') AS CALLBACK_DATE, \
       L.RETRY_COUNT||'/'||R.MAX_RETRY_COUNT AS RETRY, \
       CASE L.FINAL_STATUS WHEN 'VALIDATION_FAILED' THEN 'Fix data in MPM or ask CRM team' \
                           WHEN 'EXHAUSTED'         THEN 'Max retries - investigate' \
                           WHEN 'RECORD_NOT_FOUND'  THEN 'Push parent first' \
                           WHEN 'CRM_REJECTED'      THEN 'Contact CRM team' \
                           WHEN 'PARENT_FAILED'     THEN 'Fix + retry the PARENT record' \
                           WHEN 'DUPLICATE_RECORD'  THEN 'Already in CRM - ignore' \
                           ELSE 'Review' END AS ACTION_NEEDED \
FROM   CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN   CRM_MPM_API_REGISTRY R ON R.REGISTRY_ID=L.REGISTRY_ID \
WHERE  L.FINAL_STATUS IN ('VALIDATION_FAILED','EXHAUSTED','RECORD_NOT_FOUND','CRM_REJECTED', \
                          'DUPLICATE_RECORD','PARENT_FAILED') \
AND    NVL(L.MANUAL_RETRY,'N')='N' \
ORDER  BY CASE L.FINAL_STATUS WHEN 'EXHAUSTED' THEN 1 WHEN 'VALIDATION_FAILED' THEN 2 \
              WHEN 'PARENT_FAILED' THEN 3 WHEN 'RECORD_NOT_FOUND' THEN 4 \
              WHEN 'CRM_REJECTED' THEN 5 ELSE 6 END, L.LOG_ID DESC

query.monitor.retryqueue=\
SELECT L.LOG_ID, R.SERVICE_NAME, L.SOURCE_RECORD_ID, L.FINAL_STATUS, \
       DBMS_LOB.SUBSTR(L.REQUEST_PAYLOAD,2000,1) AS DATA_SENT, \
       SUBSTR(L.ERROR_MESSAGE,1,200) AS ERROR_DETAIL, \
       TO_CHAR(L.SENT_DATE,'DD-MON-YY HH24:MI') AS SENT_DATE, \
       TO_CHAR(L.UPDATED_DATE,'DD-MON-YY HH24:MI') AS RETRY_QUEUED_AT, \
       L.RETRY_COUNT||'/'||R.MAX_RETRY_COUNT AS RETRY_PROGRESS \
FROM   CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN   CRM_MPM_API_REGISTRY R ON R.REGISTRY_ID=L.REGISTRY_ID \
WHERE  L.MANUAL_RETRY='Y' AND L.FINAL_STATUS='FAILED' \
ORDER  BY L.LOG_ID DESC

query.monitor.triage=\
SELECT L.FINAL_STATUS, NVL(L.ERROR_CODE,'(none)') AS ERROR_CODE, \
       NVL(E.ERROR_DESCRIPTION,'Unknown / Not in Error Master') AS ERROR_DESCRIPTION, \
       NVL(E.IS_RETRYABLE,'N') AS IS_RETRYABLE, COUNT(*) AS RECORD_COUNT, \
       TO_CHAR(MIN(L.CREATED_DATE),'DD-MON-YY HH24:MI') AS FIRST_OCCURRENCE, \
       TO_CHAR(MAX(L.UPDATED_DATE),'DD-MON-YY HH24:MI') AS LAST_OCCURRENCE, \
       COUNT(DISTINCT L.REGISTRY_ID) AS SERVICES_AFFECTED \
FROM   CRM_MPM_CRM_INTEGRATION_LOG L \
LEFT   JOIN CRM_MPM_ERROR_CODE_MASTER E ON E.ERROR_CODE=L.ERROR_CODE \
WHERE  L.FINAL_STATUS NOT IN ('SUCCESS','ACK_OK','SENT','RESOLVED','RELEASED','PARENT_PENDING') \
GROUP  BY L.FINAL_STATUS, L.ERROR_CODE, E.ERROR_DESCRIPTION, E.IS_RETRYABLE \
ORDER  BY CASE L.FINAL_STATUS WHEN 'EXHAUSTED' THEN 1 WHEN 'VALIDATION_FAILED' THEN 1 \
              WHEN 'CRM_REJECTED' THEN 1 WHEN 'FAILED' THEN 2 ELSE 3 END, COUNT(*) DESC

# --- Parent Pending (Monitor sub-tab) ---
# Parent key is parsed from the message written by the package ('... Key=<value> ...').
query.monitor.parentpending=\
SELECT L.LOG_ID, R.SERVICE_NAME, L.SOURCE_RECORD_ID, L.FINAL_STATUS, \
       PR.SERVICE_NAME AS PARENT_SERVICE, \
       REGEXP_SUBSTR(L.ERROR_MESSAGE,'Key=([^ ]+)',1,1,NULL,1) AS PARENT_KEY, \
       NVL((SELECT MAX(P.FINAL_STATUS) KEEP (DENSE_RANK LAST ORDER BY P.LOG_ID) \
              FROM CRM_MPM_CRM_INTEGRATION_LOG P \
             WHERE P.REGISTRY_ID = R.DEPENDS_ON_REGISTRY_ID \
               AND P.SOURCE_RECORD_ID = REGEXP_SUBSTR(L.ERROR_MESSAGE,'Key=([^ ]+)',1,1,NULL,1) \
               AND P.FINAL_STATUS <> 'RELEASED'),'NOT_SENT') AS PARENT_STATUS, \
       TO_CHAR(L.CREATED_DATE,'DD-MON-YY HH24:MI') AS WAITING_SINCE, \
       ROUND((CAST(SYSTIMESTAMP AS DATE) - CAST(L.CREATED_DATE AS DATE))*24*60) AS WAIT_MIN, \
       SUBSTR(L.ERROR_MESSAGE,1,250) AS DETAIL \
FROM   CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN   CRM_MPM_API_REGISTRY R  ON R.REGISTRY_ID  = L.REGISTRY_ID \
LEFT   JOIN CRM_MPM_API_REGISTRY PR ON PR.REGISTRY_ID = R.DEPENDS_ON_REGISTRY_ID \
WHERE  L.FINAL_STATUS IN ('PARENT_PENDING','PARENT_FAILED') \
ORDER  BY CASE L.FINAL_STATUS WHEN 'PARENT_FAILED' THEN 1 ELSE 2 END, R.EXECUTION_ORDER, L.LOG_ID

# --- Callback Audit (base + optional filters + order) ---
query.monitor.callback.base=\
SELECT TO_CHAR(A.AUDIT_ID) AS AUDIT_ID, \
       TO_CHAR(A.RECEIVED_AT,'DD-MON-YY HH24:MI:SS') AS RECEIVED_AT, \
       A.SERVICE_NAME, A.X_UNIQUE_ID, A.CHANNEL_ID, A.REQUEST_ID, \
       A.STATUS_CODE_SENT, SUBSTR(A.DESCRIPTION_SENT,1,300) AS DESCRIPTION_SENT, \
       SUBSTR(A.RAW_PAYLOAD,1,200) AS RAW_PAYLOAD \
FROM   CRM_MPM_CALLBACK_AUDIT_LOG A \
WHERE  1=1
query.monitor.callback.filter.service= AND A.SERVICE_NAME=?
query.monitor.callback.filter.status= AND A.STATUS_CODE_SENT=?
query.monitor.callback.filter.from= AND A.RECEIVED_AT>=TO_TIMESTAMP(?,'DD-MON-YY')
query.monitor.callback.filter.to= AND A.RECEIVED_AT<TO_TIMESTAMP(?,'DD-MON-YY')+1
query.monitor.callback.order= ORDER BY A.AUDIT_ID DESC FETCH FIRST 500 ROWS ONLY

# ERROR_CODE must be a retryable code, else RUN_RETRY_JOB never picks the row
# (it requires ERROR_CODE in master with IS_RETRYABLE='Y').
query.monitor.manualretry=\
UPDATE CRM_MPM_CRM_INTEGRATION_LOG SET MANUAL_RETRY='Y', FINAL_STATUS='FAILED', \
       ERROR_CODE='MANUAL_RETRY', NEXT_RETRY_DATE=NULL, \
       IS_FINAL_ATTEMPT='N', RETRY_COUNT=0, \
       ERROR_MESSAGE=SUBSTR(ERROR_MESSAGE,1,3800)||' Manual retry: '||TO_CHAR(SYSDATE,'DD-MON-YY HH24:MI'), \
       UPDATED_DATE=SYSTIMESTAMP \
WHERE  LOG_ID=TO_NUMBER(?) \
AND    FINAL_STATUS IN ('VALIDATION_FAILED','CRM_REJECTED','EXHAUSTED','RECORD_NOT_FOUND','FAILED')

query.monitor.servicenames=\
SELECT SERVICE_NAME FROM CRM_MPM_API_REGISTRY WHERE IS_ACTIVE='Y' ORDER BY SERVICE_NAME

query.monitor.statuses=\
SELECT DISTINCT FINAL_STATUS FROM CRM_MPM_CRM_INTEGRATION_LOG ORDER BY FINAL_STATUS


# =============================================================================
# TAB: ERROR LOG (new)
# "Error" = anything not healthy / in-flight. PARENT_PENDING is waiting, not
# an error (see Monitor > Parent Pending); PARENT_FAILED IS an error.
# =============================================================================
query.errorlog.base=\
SELECT L.LOG_ID, R.SERVICE_NAME, L.ENTITY_NAME, L.OPERATION_TYPE, L.SOURCE_RECORD_ID, \
       L.FINAL_STATUS, NVL(L.ERROR_CODE,'--') AS ERROR_CODE, \
       NVL(L.HTTP_STATUS_CODE,'--') AS HTTP, NVL(L.ACK_STATUS_CODE,'--') AS ACK, \
       SUBSTR(COALESCE(L.ERROR_MESSAGE, L.CALLBACK_RESULT_DESC, L.ACK_DESCRIPTION),1,300) AS ERROR_SUMMARY, \
       L.RETRY_COUNT||'/'||R.MAX_RETRY_COUNT AS RETRY, \
       TO_CHAR(NVL(L.UPDATED_DATE,L.CREATED_DATE),'DD-MON-YY HH24:MI') AS LAST_UPDATED \
FROM   CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN   CRM_MPM_API_REGISTRY R ON R.REGISTRY_ID=L.REGISTRY_ID \
WHERE  L.FINAL_STATUS NOT IN ('SUCCESS','SENT','PENDING','ACK_OK','RESOLVED', \
                              'RELEASED','PARENT_PENDING','RETRY_IN_PROGRESS')
query.errorlog.filter.service= AND R.SERVICE_NAME=?
query.errorlog.filter.status= AND L.FINAL_STATUS=?
query.errorlog.filter.errorcode= AND L.ERROR_CODE=?
query.errorlog.filter.from= AND NVL(L.UPDATED_DATE,L.CREATED_DATE)>=TO_TIMESTAMP(?,'DD-MON-YY')
query.errorlog.filter.to= AND NVL(L.UPDATED_DATE,L.CREATED_DATE)<TO_TIMESTAMP(?,'DD-MON-YY')+1
query.errorlog.filter.recid= AND L.SOURCE_RECORD_ID LIKE '%'||?||'%'
query.errorlog.filter.text= AND UPPER(L.ERROR_MESSAGE) LIKE '%'||UPPER(?)||'%'
query.errorlog.order= ORDER BY NVL(L.UPDATED_DATE,L.CREATED_DATE) DESC, L.LOG_ID DESC FETCH FIRST 500 ROWS ONLY

# Full detail for one log row (CLOBs returned as text by Spring)
query.errorlog.detail=\
SELECT L.LOG_ID, R.SERVICE_NAME, L.ENTITY_NAME, L.OPERATION_TYPE, L.SOURCE_RECORD_ID, \
       L.TRANSACTION_GROUP_ID, L.ATTEMPT_NO, L.FINAL_STATUS, L.ERROR_CODE, \
       E.ERROR_DESCRIPTION, E.IS_RETRYABLE, L.ERROR_MESSAGE, \
       L.HTTP_STATUS_CODE, L.ACK_REQUEST_ID, L.ACK_STATUS_CODE, L.ACK_DESCRIPTION, \
       L.CALLBACK_RESULT_CODE, L.CALLBACK_RESULT_DESC, L.CRM_ENTITY_ID, L.CRM_REFERENCE_NO, \
       L.RETRY_COUNT, R.MAX_RETRY_COUNT, NVL(L.MANUAL_RETRY,'N') AS MANUAL_RETRY, \
       TO_CHAR(L.CREATED_DATE,'DD-MON-YY HH24:MI:SS')  AS CREATED, \
       TO_CHAR(L.SENT_DATE,'DD-MON-YY HH24:MI:SS')     AS SENT, \
       TO_CHAR(L.CALLBACK_DATE,'DD-MON-YY HH24:MI:SS') AS CALLBACK, \
       TO_CHAR(L.NEXT_RETRY_DATE,'DD-MON-YY HH24:MI:SS') AS NEXT_RETRY, \
       TO_CHAR(L.UPDATED_DATE,'DD-MON-YY HH24:MI:SS')  AS UPDATED, \
       L.REQUEST_PAYLOAD, L.ACK_RESPONSE, L.CALLBACK_PAYLOAD, L.CALLBACK_VALID_ERRORS \
FROM   CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN   CRM_MPM_API_REGISTRY R ON R.REGISTRY_ID=L.REGISTRY_ID \
LEFT   JOIN CRM_MPM_ERROR_CODE_MASTER E ON E.ERROR_CODE=L.ERROR_CODE \
WHERE  L.LOG_ID=TO_NUMBER(?)

query.errorlog.codes=\
SELECT DISTINCT ERROR_CODE FROM CRM_MPM_CRM_INTEGRATION_LOG \
WHERE  ERROR_CODE IS NOT NULL ORDER BY ERROR_CODE

# Scheduler job failures (package-level run history)
query.errorlog.jobruns=\
SELECT TO_CHAR(RUN_ID) AS RUN_ID, JOB_NAME, STATUS, \
       TO_CHAR(START_TIME,'DD-MON-YY HH24:MI:SS') AS STARTED, \
       TO_CHAR(END_TIME,'DD-MON-YY HH24:MI:SS')   AS ENDED, \
       RECORDS_PROCESSED, RECORDS_SUCCESS, RECORDS_FAILED, \
       SUBSTR(ERROR_MESSAGE,1,500) AS ERROR_MESSAGE \
FROM   CRM_MPM_JOB_RUN_HISTORY \
WHERE  STATUS <> 'COMPLETED' OR NVL(RECORDS_FAILED,0) > 0 \
ORDER  BY RUN_ID DESC FETCH FIRST 200 ROWS ONLY


# =============================================================================
# TAB: CHAIN STATUS (new) -- Property -> Building -> Floor -> Unit (CREATE)
# Registry IDs are resolved by SOURCE_VIEW, so the same SQL works on DEV/SIT/PROD.
# Link columns match the registry PARENT_LINK_COL config:
#   Building.BUILDING_CODE = Property.PROPERTY_CODE
#   Floor.BUILDING_ID      = Building.BUILDING_ID
#   Unit.FLOOR_ID          = Floor.FLOOR_ID
# Node status = latest log row for (registry, key), ignoring RELEASED rows.
# =============================================================================
query.chain.cte=\
WITH RG AS ( \
    SELECT MAX(CASE WHEN SOURCE_VIEW='XXMPM_CRM_PROPERTY_CREATE_V'      THEN REGISTRY_ID END) AS P_ID, \
           MAX(CASE WHEN SOURCE_VIEW='XXMPM_CRM_BUILDING_CREATE_FULL_V' THEN REGISTRY_ID END) AS B_ID, \
           MAX(CASE WHEN SOURCE_VIEW='XXMPM_CRM_FLOOR_CREATE_V'         THEN REGISTRY_ID END) AS F_ID, \
           MAX(CASE WHEN SOURCE_VIEW='XXMPM_CRM_UNIT_CREATE_V'          THEN REGISTRY_ID END) AS U_ID \
    FROM   CRM_MPM_API_REGISTRY WHERE OPERATION_TYPE='CREATE' \
), LS AS ( \
    SELECT REGISTRY_ID, SOURCE_RECORD_ID, FINAL_STATUS, CRM_ENTITY_ID, LOG_ID, \
           NVL(UPDATED_DATE,CREATED_DATE) AS LAST_TS, ERROR_MESSAGE, \
           ROW_NUMBER() OVER (PARTITION BY REGISTRY_ID, SOURCE_RECORD_ID ORDER BY LOG_ID DESC) AS RN \
    FROM   CRM_MPM_CRM_INTEGRATION_LOG \
    WHERE  FINAL_STATUS <> 'RELEASED' \
    AND    REGISTRY_ID IN (SELECT P_ID FROM RG UNION ALL SELECT B_ID FROM RG \
                           UNION ALL SELECT F_ID FROM RG UNION ALL SELECT U_ID FROM RG) \
), NODES AS ( \
    SELECT TO_CHAR(P.PROPERTY_CODE) AS PROP, 1 AS LVL_NO, 'PROPERTY' AS LVL, \
           TO_CHAR(P.PROPERTY_CODE) AS NODE_KEY, CAST(NULL AS VARCHAR2(200)) AS PARENT_KEY, RG.P_ID AS RID \
    FROM   XXMPM_CRM_PROPERTY_CREATE_V P CROSS JOIN RG \
    UNION ALL \
    SELECT TO_CHAR(B.BUILDING_CODE), 2, 'BUILDING', TO_CHAR(B.BUILDING_ID), TO_CHAR(B.BUILDING_CODE), RG.B_ID \
    FROM   XXMPM_CRM_BUILDING_CREATE_FULL_V B CROSS JOIN RG \
    UNION ALL \
    SELECT TO_CHAR(B.BUILDING_CODE), 3, 'FLOOR', TO_CHAR(F.FLOOR_ID), TO_CHAR(F.BUILDING_ID), RG.F_ID \
    FROM   XXMPM_CRM_FLOOR_CREATE_V F \
    JOIN   XXMPM_CRM_BUILDING_CREATE_FULL_V B ON TO_CHAR(B.BUILDING_ID)=TO_CHAR(F.BUILDING_ID) \
    CROSS  JOIN RG \
    UNION ALL \
    SELECT TO_CHAR(B.BUILDING_CODE), 4, 'UNIT', TO_CHAR(U.UNIT_ID), TO_CHAR(U.FLOOR_ID), RG.U_ID \
    FROM   XXMPM_CRM_UNIT_CREATE_V U \
    JOIN   XXMPM_CRM_FLOOR_CREATE_V F ON TO_CHAR(F.FLOOR_ID)=TO_CHAR(U.FLOOR_ID) \
    JOIN   XXMPM_CRM_BUILDING_CREATE_FULL_V B ON TO_CHAR(B.BUILDING_ID)=TO_CHAR(F.BUILDING_ID) \
    CROSS  JOIN RG \
), CN AS ( \
    SELECT N.PROP, N.LVL_NO, N.LVL, N.NODE_KEY, N.PARENT_KEY, \
           NVL(LS.FINAL_STATUS,'NOT_SENT') AS ST, LS.CRM_ENTITY_ID, LS.LOG_ID, LS.LAST_TS, LS.ERROR_MESSAGE \
    FROM   NODES N \
    LEFT   JOIN LS ON LS.REGISTRY_ID=N.RID AND LS.SOURCE_RECORD_ID=N.NODE_KEY AND LS.RN=1 \
)

# One row per property. CHAIN_STATE: COMPLETE / BROKEN / IN_PROGRESS / NOT_STARTED
query.chain.summary=\
SELECT * FROM ( \
    SELECT PROP AS PROPERTY_CODE, \
           MAX(CASE WHEN LVL='PROPERTY' THEN ST END) AS PROPERTY_STATUS, \
           SUM(CASE WHEN LVL='BUILDING' AND ST='SUCCESS' THEN 1 ELSE 0 END)||'/'||SUM(CASE WHEN LVL='BUILDING' THEN 1 ELSE 0 END) AS BUILDINGS, \
           SUM(CASE WHEN LVL='FLOOR'    AND ST='SUCCESS' THEN 1 ELSE 0 END)||'/'||SUM(CASE WHEN LVL='FLOOR'    THEN 1 ELSE 0 END) AS FLOORS, \
           SUM(CASE WHEN LVL='UNIT'     AND ST='SUCCESS' THEN 1 ELSE 0 END)||'/'||SUM(CASE WHEN LVL='UNIT'     THEN 1 ELSE 0 END) AS UNITS, \
           SUM(CASE WHEN ST='PARENT_PENDING' THEN 1 ELSE 0 END) AS WAITING, \
           SUM(CASE WHEN ST IN ('SENT','PENDING','FAILED','TIMEOUT','RETRY_IN_PROGRESS') THEN 1 ELSE 0 END) AS IN_FLIGHT, \
           SUM(CASE WHEN ST IN ('EXHAUSTED','VALIDATION_FAILED','RECORD_NOT_FOUND','CRM_REJECTED','PARENT_FAILED') THEN 1 ELSE 0 END) AS BROKEN, \
           SUM(CASE WHEN ST='NOT_SENT' THEN 1 ELSE 0 END) AS NOT_SENT, \
           CASE WHEN SUM(CASE WHEN ST IN ('EXHAUSTED','VALIDATION_FAILED','RECORD_NOT_FOUND','CRM_REJECTED','PARENT_FAILED') THEN 1 ELSE 0 END) > 0 THEN 'BROKEN' \
                WHEN SUM(CASE WHEN ST NOT IN ('SUCCESS','DUPLICATE_RECORD') THEN 1 ELSE 0 END) = 0 THEN 'COMPLETE' \
                WHEN SUM(CASE WHEN ST <> 'NOT_SENT' THEN 1 ELSE 0 END) = 0 THEN 'NOT_STARTED' \
                ELSE 'IN_PROGRESS' END AS CHAIN_STATE, \
           TO_CHAR(MAX(LAST_TS),'YYYY-MM-DD HH24:MI') AS LAST_ACTIVITY \
    FROM   CN \
    GROUP  BY PROP \
) S WHERE 1=1
query.chain.summary.filter.prop= AND S.PROPERTY_CODE LIKE '%'||UPPER(?)||'%'
query.chain.summary.filter.state= AND S.CHAIN_STATE=?
query.chain.summary.order=\
 ORDER BY CASE S.CHAIN_STATE WHEN 'BROKEN' THEN 1 WHEN 'IN_PROGRESS' THEN 2 \
          WHEN 'NOT_STARTED' THEN 3 ELSE 4 END, S.LAST_ACTIVITY DESC NULLS LAST, S.PROPERTY_CODE \
 FETCH FIRST 300 ROWS ONLY

# Drill-down for one property (bind: property code)
query.chain.detail=\
SELECT LVL, NODE_KEY, PARENT_KEY, ST AS STATUS, NVL(TO_CHAR(LOG_ID),'--') AS LOG_ID, \
       NVL(CRM_ENTITY_ID,'--') AS CRM_ENTITY_ID, TO_CHAR(LAST_TS,'DD-MON-YY HH24:MI') AS LAST_UPDATE, \
       SUBSTR(ERROR_MESSAGE,1,250) AS DETAIL \
FROM   CN \
WHERE  PROP = ? \
ORDER  BY LVL_NO, PARENT_KEY NULLS FIRST, NODE_KEY


# =============================================================================
# TAB: SCHEDULER
# =============================================================================
query.scheduler.list=\
SELECT JOB_NAME, CASE WHEN ENABLED='TRUE' THEN 'Y' ELSE 'N' END AS ENABLED, \
       STATE, NVL(REPEAT_INTERVAL,'--') AS REPEAT_INTERVAL, \
       TO_CHAR(NEXT_RUN_DATE,'DD-MON-YY HH24:MI') AS NEXT_RUN, \
       TO_CHAR(LAST_START_DATE,'DD-MON-YY HH24:MI') AS LAST_RUN, \
       NVL(COMMENTS,'--') AS COMMENTS \
FROM   USER_SCHEDULER_JOBS \
ORDER  BY JOB_NAME

query.scheduler.enable=BEGIN DBMS_SCHEDULER.ENABLE(?); END;
query.scheduler.disable=BEGIN DBMS_SCHEDULER.DISABLE(?); END;
query.scheduler.runnow=BEGIN DBMS_SCHEDULER.RUN_JOB(?,FALSE); END;
query.scheduler.stop=BEGIN DBMS_SCHEDULER.STOP_JOB(?,TRUE); END;

# Binds: jobName, job_action (PL/SQL block), repeatInterval, enabled ('Y'/'N'), comments
query.scheduler.create=\
BEGIN DBMS_SCHEDULER.CREATE_JOB( \
    job_name        => ?, \
    job_type        => 'PLSQL_BLOCK', \
    job_action      => ?, \
    repeat_interval => ?, \
    enabled         => (? = 'Y'), \
    comments        => ?); \
END;

query.scheduler.history=\
SELECT TO_CHAR(LOG_ID), JOB_NAME, STATUS, \
       TO_CHAR(LOG_DATE,'DD-MON-YY HH24:MI') AS RUN_TIME, OPERATION, USER_NAME \
FROM   USER_SCHEDULER_JOB_LOG \
WHERE  JOB_NAME=? \
ORDER  BY LOG_DATE DESC FETCH FIRST 20 ROWS ONLY


# =============================================================================
# TAB: HEALTH CHECK / TEST PUSH / PING
# =============================================================================
query.health.urls=\
SELECT NAME, URL, NVL(LAST_STATUS,'--') AS LAST_STATUS, \
       TO_CHAR(LAST_TESTED,'DD-MON-YY HH24:MI') AS LAST_TESTED \
FROM   CRM_MPM_HEALTH_URLS \
ORDER  BY NAME

query.health.token=BEGIN PKG_CRM_INTEGRATION.GET_BEARER_TOKEN(?); END;
query.health.testpush=BEGIN PKG_CRM_INTEGRATION.RUN_OUTBOUND_JOB; END;
query.ping=SELECT TO_CHAR(SYSDATE,'DD-MON-YY HH24:MI:SS') FROM DUAL

query.testpush.registryid=\
SELECT REGISTRY_ID FROM CRM_MPM_API_REGISTRY WHERE SERVICE_NAME = ?

query.testpush.cleanup=\
DELETE FROM CRM_MPM_CRM_INTEGRATION_LOG \
WHERE  REGISTRY_ID = ? AND SOURCE_RECORD_ID = ? AND RETRY_COUNT = 0

# Callable: 1=registryId, 2=keyValue, 3=logId OUT
query.testpush.send=\
BEGIN PKG_CRM_INTEGRATION.SEND_TO_APIC( \
    p_registry_id          => ?, \
    p_key_value            => ?, \
    p_transaction_group_id => NULL, \
    p_attempt_no           => 1, \
    p_log_id_out           => ?); \
END;


# =============================================================================
# TAB: USERS (login + admin)
# =============================================================================
query.user.login=\
SELECT USERNAME, PASSWORD_HASH, ROLE, IS_ACTIVE FROM CRM_MPM_APP_USERS WHERE USERNAME = ?

query.user.get=\
SELECT USERNAME, FULL_NAME, ROLE, IS_ACTIVE, \
       NVL(ALLOWED_SERVICES,'All') AS ALLOWED_SERVICES, \
       TO_CHAR(LAST_LOGIN,'DD-MON-YY HH24:MI') AS LAST_LOGIN, \
       TO_CHAR(CREATED_DATE,'DD-MON-YY') AS CREATED_DATE \
FROM   CRM_MPM_APP_USERS WHERE USERNAME = ?

query.user.list=\
SELECT USERNAME, NVL(FULL_NAME,'') AS FULL_NAME, ROLE, IS_ACTIVE, \
       NVL(ALLOWED_SERVICES,'All') AS ALLOWED_SERVICES, \
       TO_CHAR(LAST_LOGIN,'DD-MON-YY HH24:MI') AS LAST_LOGIN, \
       TO_CHAR(CREATED_DATE,'DD-MON-YY') AS CREATED_DATE \
FROM   CRM_MPM_APP_USERS \
ORDER  BY ROLE, USERNAME

query.user.exists=SELECT COUNT(*) FROM CRM_MPM_APP_USERS WHERE USERNAME=?

query.user.update.withpwd=\
UPDATE CRM_MPM_APP_USERS SET FULL_NAME=?, ROLE=?, IS_ACTIVE=?, \
       ALLOWED_SERVICES=?, PASSWORD_HASH=?, UPDATED_DATE=SYSDATE \
WHERE  USERNAME=?

query.user.update.nopwd=\
UPDATE CRM_MPM_APP_USERS SET FULL_NAME=?, ROLE=?, IS_ACTIVE=?, \
       ALLOWED_SERVICES=?, UPDATED_DATE=SYSDATE \
WHERE  USERNAME=?

query.user.insert=\
INSERT INTO CRM_MPM_APP_USERS \
    (USERNAME, FULL_NAME, PASSWORD_HASH, ROLE, IS_ACTIVE, ALLOWED_SERVICES, CREATED_DATE, UPDATED_DATE) \
VALUES (?, ?, ?, ?, ?, ?, SYSDATE, SYSDATE)

query.user.toggle=\
UPDATE CRM_MPM_APP_USERS SET IS_ACTIVE=?, UPDATED_DATE=SYSDATE WHERE USERNAME=?

query.user.resetpwd=\
UPDATE CRM_MPM_APP_USERS SET PASSWORD_HASH=?, UPDATED_DATE=SYSDATE WHERE USERNAME=?

query.user.lastlogin=\
UPDATE CRM_MPM_APP_USERS SET LAST_LOGIN=SYSDATE WHERE USERNAME=?
