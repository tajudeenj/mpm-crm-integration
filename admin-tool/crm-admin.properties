query.mapping.list=\
SELECT TO_CHAR(M.MAPPING_ID), M.JSON_MAPPING_NAME, \
       TO_CHAR(M.DISPLAY_ORDER), M.SOURCE_COLUMN, \
       M.JSON_PATH, M.DATA_TYPE, \
       NVL(M.DATE_FORMAT,''), \
       NVL(M.IS_MANDATORY,'N'), \
       M.IS_ACTIVE \
FROM   CRM_MPM_API_FIELD_MAPPING M \
WHERE  M.JSON_MAPPING_NAME = ? \
ORDER BY M.DISPLAY_ORDER

query.mapping.all=\
SELECT TO_CHAR(M.MAPPING_ID), M.JSON_MAPPING_NAME, \
       TO_CHAR(M.DISPLAY_ORDER), M.SOURCE_COLUMN, \
       M.JSON_PATH, M.DATA_TYPE, \
       NVL(M.DATE_FORMAT,''), \
       NVL(M.IS_MANDATORY,'N'), \
       M.IS_ACTIVE \
FROM   CRM_MPM_API_FIELD_MAPPING M \
ORDER BY M.JSON_MAPPING_NAME, M.DISPLAY_ORDER

query.mapping.save=\
MERGE INTO CRM_MPM_API_FIELD_MAPPING m \
USING (SELECT ? AS jmn, ? AS sc FROM DUAL) s \
ON (m.JSON_MAPPING_NAME = s.jmn AND m.SOURCE_COLUMN = s.sc) \
WHEN MATCHED THEN UPDATE SET \
    DISPLAY_ORDER=TO_NUMBER(?), JSON_PATH=?, \
    DATA_TYPE=?, DATE_FORMAT=?, IS_MANDATORY=?, IS_ACTIVE=? \
WHEN NOT MATCHED THEN INSERT ( \
    JSON_MAPPING_NAME, DISPLAY_ORDER, SOURCE_COLUMN, \
    JSON_PATH, DATA_TYPE, DATE_FORMAT, IS_MANDATORY, IS_ACTIVE) \
VALUES (?,TO_NUMBER(?),?,?,?,?,?,?)

query.service.names.mapping=\
SELECT DISTINCT JSON_MAPPING_NAME \
FROM   CRM_MPM_API_FIELD_MAPPING \
ORDER BY JSON_MAPPING_NAME

# =============================================================================
# TAB 4: WATERMARK
# =============================================================================
query.watermark.list=\
SELECT R.SERVICE_NAME, \
       TO_CHAR(W.LAST_PROCESSED_TS,'DD-MON-YY HH24:MI'), \
       NVL(W.LAST_RUN_STATUS,'--'), \
       TO_CHAR(NVL(W.LAST_RUN_RECORDS,0)), \
       TO_CHAR(R.REGISTRY_ID) \
FROM   CRM_MPM_API_REGISTRY  R \
LEFT JOIN CRM_MPM_API_WATERMARK W \
    ON W.REGISTRY_ID = R.REGISTRY_ID \
WHERE  R.IS_ACTIVE = 'Y' \
ORDER BY R.EXECUTION_ORDER, R.SERVICE_NAME

query.watermark.reset=\
UPDATE CRM_MPM_API_WATERMARK \
SET    LAST_PROCESSED_TS = NULL, \
       LAST_RUN_RECORDS  = 0, \
       LAST_RUN_STATUS   = 'RESET', \
       UPDATED_DATE      = SYSDATE \
WHERE  REGISTRY_ID = ( \
    SELECT REGISTRY_ID FROM CRM_MPM_API_REGISTRY \
    WHERE  SERVICE_NAME = ?)

query.watermark.set.date=\
UPDATE CRM_MPM_API_WATERMARK \
SET    LAST_PROCESSED_TS = TO_TIMESTAMP(?,'DD-MON-YY HH24:MI'), \
       UPDATED_DATE      = SYSDATE \
WHERE  REGISTRY_ID = ( \
    SELECT REGISTRY_ID FROM CRM_MPM_API_REGISTRY \
    WHERE  SERVICE_NAME = ?)

