query.errorcode.list=\
SELECT ERROR_CODE, ERROR_CATEGORY, \
       ERROR_DESCRIPTION, IS_RETRYABLE \
FROM   CRM_MPM_ERROR_CODE_MASTER \
ORDER BY IS_RETRYABLE DESC, ERROR_CODE

query.errorcode.save=\
MERGE INTO CRM_MPM_ERROR_CODE_MASTER e \
USING (SELECT ? AS ec FROM DUAL) s \
ON (e.ERROR_CODE = s.ec) \
WHEN MATCHED THEN UPDATE SET \
    ERROR_CATEGORY=?, ERROR_DESCRIPTION=?, IS_RETRYABLE=? \
WHEN NOT MATCHED THEN INSERT ( \
    ERROR_CODE, ERROR_CATEGORY, ERROR_DESCRIPTION, IS_RETRYABLE) \
VALUES (?,?,?,?)

# =============================================================================
# TAB 6: MONITOR
# =============================================================================
query.service.names=\
SELECT SERVICE_NAME FROM CRM_MPM_API_REGISTRY \
WHERE IS_ACTIVE='Y' ORDER BY SERVICE_NAME

query.status.list=\
SELECT DISTINCT FINAL_STATUS \
FROM   CRM_MPM_CRM_INTEGRATION_LOG \
ORDER BY FINAL_STATUS

query.dashboard=\
SELECT R.SERVICE_NAME, COUNT(*) AS TOTAL, \
    SUM(CASE WHEN L.FINAL_STATUS='SUCCESS' THEN 1 ELSE 0 END) AS SUCCESS, \
    SUM(CASE WHEN L.FINAL_STATUS='SENT' THEN 1 ELSE 0 END) AS PENDING, \
    SUM(CASE WHEN L.FINAL_STATUS='VALIDATION_FAILED' THEN 1 ELSE 0 END) AS VAL_FAILED, \
    SUM(CASE WHEN L.FINAL_STATUS='DUPLICATE_RECORD' THEN 1 ELSE 0 END) AS DUPLICATE, \
    SUM(CASE WHEN L.FINAL_STATUS IN ('FAILED','TIMEOUT') THEN 1 ELSE 0 END) AS AUTO_RETRY, \
    SUM(CASE WHEN L.FINAL_STATUS='EXHAUSTED' THEN 1 ELSE 0 END) AS EXHAUSTED, \
    SUM(CASE WHEN L.FINAL_STATUS='RECORD_NOT_FOUND' THEN 1 ELSE 0 END) AS PARENT_MISSING, \
    SUM(CASE WHEN L.FINAL_STATUS IN ('VALIDATION_FAILED','EXHAUSTED', \
        'RECORD_NOT_FOUND','CRM_REJECTED') \
        AND NVL(L.MANUAL_RETRY,'N')='N' THEN 1 ELSE 0 END) AS ACTION_NEEDED, \
    TO_CHAR(MAX(L.SENT_DATE),'DD-MON-YY HH24:MI') AS LAST_SENT \
FROM  CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN  CRM_MPM_API_REGISTRY R ON R.REGISTRY_ID=L.REGISTRY_ID \
GROUP BY R.SERVICE_NAME \
ORDER BY ACTION_NEEDED DESC, R.SERVICE_NAME

query.main.report=\
SELECT L.LOG_ID, R.SERVICE_NAME, L.SOURCE_RECORD_ID, \
    L.FINAL_STATUS, \
    DBMS_LOB.SUBSTR(L.REQUEST_PAYLOAD,2000,1) AS DATA_SENT, \
    SUBSTR(L.CALLBACK_VALID_ERRORS,1,300) AS FAILED_FIELDS, \
    SUBSTR(L.CALLBACK_RESULT_DESC,1,200) AS CRM_RESPONSE, \
    SUBSTR(L.ERROR_MESSAGE,1,200) AS ERROR_DETAIL, \
    L.CRM_REFERENCE_NO, \
    TO_CHAR(L.SENT_DATE,'DD-MON-YY HH24:MI') AS SENT_DATE, \
    TO_CHAR(L.CALLBACK_DATE,'DD-MON-YY HH24:MI') AS CALLBACK_DATE, \
    L.RETRY_COUNT||'/'||R.MAX_RETRY_COUNT AS RETRY, \
    NVL(L.MANUAL_RETRY,'N') AS MANUAL_RETRY, \
    CASE \
        WHEN NVL(L.MANUAL_RETRY,'N')='Y' \
            THEN 'MANUAL RETRY' \
        WHEN NVL(L.ATTEMPT_NO,1)=1 AND NVL(L.RETRY_COUNT,0)=0 \
            THEN 'OUTBOUND JOB' \
        WHEN NVL(L.RETRY_COUNT,0)>0 \
            THEN 'RETRY JOB (x'||L.RETRY_COUNT||')' \
        WHEN L.FINAL_STATUS='TIMEOUT' \
            THEN 'TIMEOUT JOB' \
        ELSE 'OUTBOUND JOB' \
    END AS EXECUTED_BY, \
    CASE \
        WHEN L.FINAL_STATUS='SUCCESS' THEN 'No action' \
        WHEN L.FINAL_STATUS='SENT' THEN 'Waiting callback' \
        WHEN L.FINAL_STATUS='VALIDATION_FAILED' THEN 'Fix data then retry' \
        WHEN L.FINAL_STATUS='EXHAUSTED' THEN 'Investigate and retry' \
        WHEN L.FINAL_STATUS='DUPLICATE_RECORD' THEN 'Already in CRM' \
        WHEN L.FINAL_STATUS='RECORD_NOT_FOUND' THEN 'Push parent first' \
        ELSE 'Review error' \
    END AS ACTION \
FROM  CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN  CRM_MPM_API_REGISTRY R ON R.REGISTRY_ID=L.REGISTRY_ID \
WHERE (? IS NULL OR R.SERVICE_NAME=?) \
  AND (? IS NULL OR L.FINAL_STATUS=?) \
  AND (? IS NULL OR L.SENT_DATE>=TO_DATE(?,'DD-MON-YY')) \
  AND (? IS NULL OR L.SENT_DATE<=TO_DATE(?,'DD-MON-YY')+1) \
  AND (? IS NULL OR L.SOURCE_RECORD_ID LIKE '%'||?||'%') \
ORDER BY L.LOG_ID DESC \
FETCH FIRST 500 ROWS ONLY

query.action.needed=\
SELECT L.LOG_ID, R.SERVICE_NAME, L.SOURCE_RECORD_ID, \
    L.FINAL_STATUS, \
    DBMS_LOB.SUBSTR(L.REQUEST_PAYLOAD,2000,1) AS DATA_SENT, \
    SUBSTR(L.CALLBACK_VALID_ERRORS,1,300) AS FAILED_FIELDS, \
    SUBSTR(L.CALLBACK_RESULT_DESC,1,200) AS CRM_RESPONSE, \
    SUBSTR(L.ERROR_MESSAGE,1,200) AS ERROR_DETAIL, \
    TO_CHAR(L.SENT_DATE,'DD-MON-YY HH24:MI') AS SENT_DATE, \
    TO_CHAR(L.CALLBACK_DATE,'DD-MON-YY HH24:MI') AS CALLBACK_DATE, \
    L.RETRY_COUNT||'/'||R.MAX_RETRY_COUNT AS RETRY, \
    CASE L.FINAL_STATUS \
        WHEN 'VALIDATION_FAILED' THEN 'Fix data in MPM or ask CRM team' \
        WHEN 'EXHAUSTED' THEN 'Max retries - investigate' \
        WHEN 'RECORD_NOT_FOUND' THEN 'Push parent first' \
        WHEN 'CRM_REJECTED' THEN 'Contact CRM team' \
        WHEN 'DUPLICATE_RECORD' THEN 'Already in CRM - ignore' \
        ELSE 'Review' \
    END AS ACTION_NEEDED \
FROM  CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN  CRM_MPM_API_REGISTRY R ON R.REGISTRY_ID=L.REGISTRY_ID \
WHERE L.FINAL_STATUS IN \
    ('VALIDATION_FAILED','EXHAUSTED','RECORD_NOT_FOUND', \
     'CRM_REJECTED','DUPLICATE_RECORD') \
  AND NVL(L.MANUAL_RETRY,'N')='N' \
ORDER BY \
    CASE L.FINAL_STATUS \
        WHEN 'EXHAUSTED' THEN 1 \
        WHEN 'VALIDATION_FAILED' THEN 2 \
        WHEN 'RECORD_NOT_FOUND' THEN 3 \
        WHEN 'CRM_REJECTED' THEN 4 \
        ELSE 5 END, L.LOG_ID DESC

query.retry.queue=\
SELECT L.LOG_ID, R.SERVICE_NAME, L.SOURCE_RECORD_ID, \
    L.FINAL_STATUS, \
    DBMS_LOB.SUBSTR(L.REQUEST_PAYLOAD,2000,1) AS DATA_SENT, \
    SUBSTR(L.ERROR_MESSAGE,1,200) AS ERROR_DETAIL, \
    TO_CHAR(L.SENT_DATE,'DD-MON-YY HH24:MI') AS SENT_DATE, \
    TO_CHAR(L.UPDATED_DATE,'DD-MON-YY HH24:MI') AS RETRY_QUEUED_AT, \
    L.RETRY_COUNT||'/'||R.MAX_RETRY_COUNT AS RETRY_PROGRESS \
FROM  CRM_MPM_CRM_INTEGRATION_LOG L \
JOIN  CRM_MPM_API_REGISTRY R ON R.REGISTRY_ID=L.REGISTRY_ID \
WHERE L.MANUAL_RETRY='Y' AND L.FINAL_STATUS='FAILED' \
ORDER BY L.LOG_ID DESC

# Error triage -- groups failed records by status+error code, assigns priority
# Priority logic handled in Java: EXHAUSTED+NOT_RETRYABLE=1-CRITICAL, EXHAUSTED+RETRYABLE=2-MANUAL, FAILED+RETRYABLE=3-AUTO
query.error.triage=\
SELECT \
    L.FINAL_STATUS, \
    NVL(L.ERROR_CODE,'(none)') AS ERROR_CODE, \
    NVL(E.ERROR_DESCRIPTION,'Unknown / Not in Error Master') AS ERROR_DESCRIPTION, \
    NVL(E.IS_RETRYABLE,'N') AS IS_RETRYABLE, \
    COUNT(*) AS RECORD_COUNT, \
    TO_CHAR(MIN(L.CREATED_DATE),'DD-MON-YY HH24:MI') AS FIRST_OCCURRENCE, \
    TO_CHAR(MAX(L.UPDATED_DATE),'DD-MON-YY HH24:MI') AS LAST_OCCURRENCE, \
    COUNT(DISTINCT L.REGISTRY_ID) AS SERVICES_AFFECTED \
FROM  CRM_MPM_CRM_INTEGRATION_LOG L \
LEFT JOIN CRM_MPM_ERROR_CODE_MASTER E ON E.ERROR_CODE = L.ERROR_CODE \
WHERE L.FINAL_STATUS NOT IN ('SUCCESS','ACK_OK','SENT','RESOLVED') \
GROUP BY L.FINAL_STATUS, L.ERROR_CODE, E.ERROR_DESCRIPTION, E.IS_RETRYABLE \
ORDER BY \
    CASE L.FINAL_STATUS \
        WHEN 'EXHAUSTED'         THEN 1 \
        WHEN 'VALIDATION_FAILED' THEN 1 \
        WHEN 'CRM_REJECTED'      THEN 1 \
        WHEN 'FAILED'            THEN 2 \
        ELSE 3 \
    END, \
    COUNT(*) DESC

# Callback Audit Log -- actual columns confirmed: AUDIT_ID, RECEIVED_AT, SERVICE_NAME,
# X_UNIQUE_ID, CHANNEL_ID, REQUEST_ID, RAW_PAYLOAD, CREATED_DATE, STATUS_CODE_SENT, DESCRIPTION_SENT
# CB_0000 = processed OK, CB_1002 = no matching log entry (orphan callback)
query.callback.audit=\
SELECT \
    TO_CHAR(A.AUDIT_ID)                                     AS AUDIT_ID, \
    TO_CHAR(A.RECEIVED_AT,'DD-MON-YY HH24:MI:SS')          AS RECEIVED_AT, \
    A.SERVICE_NAME, \
    A.X_UNIQUE_ID, \
    A.CHANNEL_ID, \
    A.REQUEST_ID, \
    A.STATUS_CODE_SENT, \
    SUBSTR(A.DESCRIPTION_SENT,1,300)                        AS DESCRIPTION_SENT, \
    SUBSTR(A.RAW_PAYLOAD,1,200)                             AS RAW_PAYLOAD \
FROM  CRM_MPM_CALLBACK_AUDIT_LOG A \
WHERE (? IS NULL OR A.SERVICE_NAME    = ?) \
  AND (? IS NULL OR A.STATUS_CODE_SENT= ?) \
  AND (? IS NULL OR A.RECEIVED_AT    >= TO_TIMESTAMP(?,'DD-MON-YY')) \
  AND (? IS NULL OR A.RECEIVED_AT    <= TO_TIMESTAMP(?,'DD-MON-YY')+1) \
ORDER BY A.AUDIT_ID DESC \
FETCH FIRST 500 ROWS ONLY

query.manual.retry=\
UPDATE CRM_MPM_CRM_INTEGRATION_LOG \
SET    MANUAL_RETRY='Y', FINAL_STATUS='FAILED', \
       IS_FINAL_ATTEMPT='N', RETRY_COUNT=0, \
       ERROR_MESSAGE=SUBSTR(ERROR_MESSAGE,1,3800)|| \
           ' Manual retry: '||TO_CHAR(SYSDATE,'DD-MON-YY HH24:MI'), \
       UPDATED_DATE=SYSTIMESTAMP \
WHERE  LOG_ID=TO_NUMBER(?) \
AND    FINAL_STATUS IN \
    ('VALIDATION_FAILED','CRM_REJECTED','EXHAUSTED', \
     'RECORD_NOT_FOUND','FAILED')

# =============================================================================
# TAB 8: SCHEDULER MANAGER
# =============================================================================
query.scheduler.list=\
SELECT JOB_NAME, \
       CASE WHEN ENABLED='TRUE' THEN 'Y' ELSE 'N' END AS ENABLED, \
       STATE, \
       NVL(REPEAT_INTERVAL,'--') AS REPEAT_INTERVAL, \
       TO_CHAR(NEXT_RUN_DATE,'DD-MON-YY HH24:MI') AS NEXT_RUN, \
       TO_CHAR(LAST_START_DATE,'DD-MON-YY HH24:MI') AS LAST_RUN, \
       NVL(COMMENTS,'--') AS COMMENTS \
FROM   USER_SCHEDULER_JOBS \
ORDER  BY JOB_NAME

query.scheduler.add=\
DECLARE \
BEGIN \
    DBMS_SCHEDULER.CREATE_JOB( \
        job_name        => :jobname, \
        job_type        => :jobtype, \
        job_action      => :jobaction, \
        repeat_interval => :interval, \
        enabled         => TRUE, \
        auto_drop       => FALSE); \
END;

query.scheduler.history=\
SELECT TO_CHAR(LOG_ID), JOB_NAME, STATUS, \
       TO_CHAR(LOG_DATE,'DD-MON-YY HH24:MI') AS RUN_TIME, \
       OPERATION, \
       USER_NAME, \
       SUBSTR(DBMS_LOB.SUBSTR(ADDITIONAL_INFO,300,1),'1') AS INFO \
FROM   USER_SCHEDULER_JOB_LOG \
WHERE  JOB_NAME = ? \
ORDER  BY LOG_DATE DESC \
FETCH FIRST 20 ROWS ONLY

query.mapping.set.active=\
UPDATE CRM_MPM_API_FIELD_MAPPING \
SET IS_ACTIVE=? WHERE MAPPING_ID=TO_NUMBER(?)

# =============================================================================
# CREDENTIAL: DECRYPT WALLET PASSWORD TEST
# Named binds: credcode
# Out params:  result
# =============================================================================
query.cred.decrypt.wallet.test=\
DECLARE \
    v_plain  VARCHAR2(4000); \
    v_result VARCHAR2(4000); \
BEGIN \
    SELECT NVL(WALLET_PASSWORD,'NULL') INTO v_plain \
    FROM   CRM_MPM_API_CREDENTIALS \
    WHERE  CRED_CODE = :credcode; \
    IF v_plain IS NULL OR v_plain = 'NULL' THEN \
        v_result := 'NOT SET (NULL)'; \
    ELSIF v_plain = '*** ENCRYPTED ***' THEN \
        v_result := 'Stored as encrypted marker'; \
    ELSE \
        v_result := 'Plain text - length=' || LENGTH(v_plain); \
    END IF; \
    :result := v_result; \
END;

