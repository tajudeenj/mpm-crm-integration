# =============================================================================
# TAB 1: CREDENTIALS
# =============================================================================
query.cred.list=\
SELECT CRED_CODE, CLIENT_ID, TOKEN_URL, IS_ACTIVE, \
       CASE WHEN CLIENT_SECRET_ENCRYPTED IS NOT NULL \
            THEN 'AES256 OK' ELSE 'Plain Text' END AS SECRET_ENC, \
       TO_CHAR(UPDATED_DATE,'DD-MON-YY HH24:MI') AS UPDATED \
FROM   CRM_MPM_API_CREDENTIALS \
ORDER BY CRED_CODE

query.cred.load.single=\
SELECT CRED_CODE, TOKEN_URL, CLIENT_ID, \
       NVL(SCOPE,''), NVL(GRANT_TYPE,'client_credentials'), \
       NVL(WALLET_PATH,''), IS_ACTIVE \
FROM   CRM_MPM_API_CREDENTIALS \
WHERE  CRED_CODE = ?

query.cred.save=\
DECLARE \
    v_key     RAW(32); \
    v_sec_enc BLOB; \
    v_secret  VARCHAR2(4000) := :secret; \
BEGIN \
    SELECT ENCRYPT_KEY INTO v_key \
    FROM   CRM_MPM_ENCRYPT_CONFIG \
    WHERE  IS_ACTIVE = 'Y' AND ROWNUM = 1; \
    v_sec_enc := DBMS_CRYPTO.ENCRYPT( \
        src => UTL_RAW.CAST_TO_RAW(v_secret), \
        typ => DBMS_CRYPTO.ENCRYPT_AES256 + \
               DBMS_CRYPTO.CHAIN_CBC + DBMS_CRYPTO.PAD_PKCS5, \
        key => v_key); \
    MERGE INTO CRM_MPM_API_CREDENTIALS t \
    USING (SELECT :credcode AS cc FROM DUAL) s \
    ON    (t.CRED_CODE = s.cc) \
    WHEN MATCHED THEN UPDATE SET \
        TOKEN_URL               = :tokenurl, \
        CLIENT_ID               = :clientid, \
        CLIENT_SECRET_ENCRYPTED = v_sec_enc, \
        CLIENT_SECRET_REF       = '*** ENCRYPTED ***', \
        ENCRYPT_KEY_REF         = 'CRM_INTEGRATION_KEY', \
        SCOPE                   = :scope, \
        GRANT_TYPE              = :granttype, \
        WALLET_PATH             = :walletpath, \
        WALLET_PASSWORD         = :walletpwd, \
        IS_ACTIVE               = :isactive, \
        UPDATED_DATE            = SYSDATE \
    WHEN NOT MATCHED THEN INSERT ( \
        CRED_CODE, TOKEN_URL, CLIENT_ID, \
        CLIENT_SECRET_ENCRYPTED, CLIENT_SECRET_REF, ENCRYPT_KEY_REF, \
        SCOPE, GRANT_TYPE, \
        WALLET_PATH, WALLET_PASSWORD, \
        IS_ACTIVE, CREATED_DATE, UPDATED_DATE) \
    VALUES ( \
        :credcode2, :tokenurl2, :clientid2, \
        v_sec_enc, '*** ENCRYPTED ***', 'CRM_INTEGRATION_KEY', \
        :scope2, :granttype2, \
        :walletpath2, :walletpwd2, \
        :isactive2, SYSDATE, SYSDATE); \
END;

query.cred.rotate.secret=\
DECLARE \
    v_key RAW(32); \
    v_enc BLOB; \
BEGIN \
    SELECT ENCRYPT_KEY INTO v_key FROM CRM_MPM_ENCRYPT_CONFIG \
    WHERE IS_ACTIVE = 'Y' AND ROWNUM = 1; \
    v_enc := DBMS_CRYPTO.ENCRYPT( \
        src => UTL_RAW.CAST_TO_RAW(:newval), \
        typ => DBMS_CRYPTO.ENCRYPT_AES256 + \
               DBMS_CRYPTO.CHAIN_CBC + DBMS_CRYPTO.PAD_PKCS5, \
        key => v_key); \
    UPDATE CRM_MPM_API_CREDENTIALS \
    SET    CLIENT_SECRET_ENCRYPTED = v_enc, \
           CLIENT_SECRET_REF       = '*** ENCRYPTED ***', \
           ENCRYPT_KEY_REF         = 'CRM_INTEGRATION_KEY', \
           UPDATED_DATE            = SYSDATE \
    WHERE  CRED_CODE = :credcode; \
END;

query.cred.decrypt.test=\
DECLARE \
    v_key     RAW(32); \
    v_sec_enc BLOB; \
    v_sec_dec VARCHAR2(4000); \
    v_result  VARCHAR2(4000); \
BEGIN \
    SELECT ENCRYPT_KEY INTO v_key FROM CRM_MPM_ENCRYPT_CONFIG \
    WHERE IS_ACTIVE = 'Y' AND ROWNUM = 1; \
    SELECT CLIENT_SECRET_ENCRYPTED INTO v_sec_enc \
    FROM   CRM_MPM_API_CREDENTIALS \
    WHERE  CRED_CODE = :credcode; \
    IF v_sec_enc IS NOT NULL THEN \
        v_sec_dec := UTL_RAW.CAST_TO_VARCHAR2( \
            DBMS_CRYPTO.DECRYPT( \
                src => v_sec_enc, \
                typ => DBMS_CRYPTO.ENCRYPT_AES256 + \
                       DBMS_CRYPTO.CHAIN_CBC + DBMS_CRYPTO.PAD_PKCS5, \
                key => v_key)); \
        v_result := 'OK - length=' || LENGTH(v_sec_dec); \
    ELSE \
        v_result := 'NOT ENCRYPTED'; \
    END IF; \
    :result := v_result; \
END;

query.cred.codes=\
SELECT CRED_CODE FROM CRM_MPM_API_CREDENTIALS \
WHERE IS_ACTIVE = 'Y' ORDER BY CRED_CODE

