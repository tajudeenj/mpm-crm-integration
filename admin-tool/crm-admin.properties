query.registry.list=\
SELECT SERVICE_NAME, ENTITY_NAME, OPERATION_TYPE, SOURCE_TYPE, \
       NVL(SOURCE_VIEW,''), NVL(SOURCE_PROC,''), \
       NVL(SOURCE_FILTER_COL,''), NVL(SOURCE_KEY_COL,''), \
       NVL(JSON_MAPPING_NAME,''), \
       NVL(RECORD_TYPE_HDR,''), NVL(EVENT_CODE_HDR,''), \
       NVL(APIC_ENDPOINT_URL,''), NVL(HTTP_METHOD,''), \
       NVL(APIC_API_VERSION,''), \
       NVL(CALLBACK_TARGET_TABLE,''), NVL(CALLBACK_KEY_COL,''), \
       NVL(CALLBACK_STATUS_COL,''), NVL(CALLBACK_REF_COL,''), \
       NVL(POST_CALLBACK_PROC,''), \
       NVL(CRED_CODE,''), \
       TO_CHAR(NVL(EXECUTION_ORDER,99)), \
       TO_CHAR(NVL(BATCH_SIZE,100)), \
       TO_CHAR(NVL(MAX_RETRY_COUNT,3)), \
       TO_CHAR(NVL(RETRY_INTERVAL_MINUTES,30)), \
       TO_CHAR(NVL(TIMEOUT_MINUTES,60)), \
       IS_ACTIVE \
FROM   CRM_MPM_API_REGISTRY \
ORDER BY EXECUTION_ORDER, SERVICE_NAME

query.registry.save=\
MERGE INTO CRM_MPM_API_REGISTRY r \
USING (SELECT ? AS sn FROM DUAL) s \
ON (r.SERVICE_NAME = s.sn) \
WHEN MATCHED THEN UPDATE SET \
    ENTITY_NAME=?, OPERATION_TYPE=?, SOURCE_TYPE=?, \
    SOURCE_VIEW=?, SOURCE_PROC=?, \
    SOURCE_FILTER_COL=?, SOURCE_KEY_COL=?, \
    JSON_MAPPING_NAME=?, \
    RECORD_TYPE_HDR=?, EVENT_CODE_HDR=?, \
    APIC_ENDPOINT_URL=?, HTTP_METHOD=?, \
    APIC_API_VERSION=?, \
    CALLBACK_TARGET_TABLE=?, CALLBACK_KEY_COL=?, \
    CALLBACK_STATUS_COL=?, CALLBACK_REF_COL=?, \
    POST_CALLBACK_PROC=?, \
    CRED_CODE=?, \
    EXECUTION_ORDER=TO_NUMBER(?), \
    BATCH_SIZE=TO_NUMBER(?), \
    MAX_RETRY_COUNT=TO_NUMBER(?), \
    RETRY_INTERVAL_MINUTES=TO_NUMBER(?), \
    TIMEOUT_MINUTES=TO_NUMBER(?), \
    IS_ACTIVE=?, UPDATED_DATE=SYSDATE \
WHEN NOT MATCHED THEN INSERT ( \
    SERVICE_NAME, ENTITY_NAME, OPERATION_TYPE, SOURCE_TYPE, \
    SOURCE_VIEW, SOURCE_PROC, \
    SOURCE_FILTER_COL, SOURCE_KEY_COL, \
    JSON_MAPPING_NAME, \
    RECORD_TYPE_HDR, EVENT_CODE_HDR, \
    APIC_ENDPOINT_URL, HTTP_METHOD, APIC_API_VERSION, \
    CALLBACK_TARGET_TABLE, CALLBACK_KEY_COL, \
    CALLBACK_STATUS_COL, CALLBACK_REF_COL, \
    POST_CALLBACK_PROC, CRED_CODE, \
    EXECUTION_ORDER, BATCH_SIZE, \
    MAX_RETRY_COUNT, RETRY_INTERVAL_MINUTES, \
    TIMEOUT_MINUTES, IS_ACTIVE, \
    CREATED_DATE, UPDATED_DATE) \
VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?, \
    TO_NUMBER(?),TO_NUMBER(?),TO_NUMBER(?), \
    TO_NUMBER(?),TO_NUMBER(?),?,SYSDATE,SYSDATE)

query.registry.set.active=\
UPDATE CRM_MPM_API_REGISTRY \
SET IS_ACTIVE=?, UPDATED_DATE=SYSDATE \
WHERE SERVICE_NAME=?

# =============================================================================
# TAB 3: FIELD MAPPINGS
